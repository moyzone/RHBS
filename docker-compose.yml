version: "3.8"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: restopia
      POSTGRES_PASSWORD: restopia_password
      POSTGRES_DB: restopia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    image: node:20
    working_dir: /app
    volumes:
      - .:/app
    command: >
      sh -c "npm install -g pnpm && cd apps/web && pnpm install && npm run dev"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
